[package]
name = "graphite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded single-file GraphRAG engine and client for knowledge graphs and AI agent memory"
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
graphite-core = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[features]
default = ["embedded", "fastembed", "tiktoken"]
embedded = ["dep:graphite-core"]
fastembed = ["graphite-core/fastembed"]
tiktoken = ["graphite-core/tiktoken"]

[dev-dependencies]
tempfile = "3.17"
