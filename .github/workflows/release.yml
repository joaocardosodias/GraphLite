name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: "tar.gz"
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: macos-13
            target: x86_64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
            archive_ext: "zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin graphite
          else
            cargo build --release --target ${{ matrix.target }} --bin graphite
          fi
        shell: bash

      - name: Package release assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="graphite-v${VERSION}-${{ matrix.target }}"
          mkdir -p "${PKG_NAME}"

          # Copy binaries
          cp "target/${{ matrix.target }}/release/graphite${{ matrix.binary_ext }}" "${PKG_NAME}/"
          cp README.md LICENSE* "${PKG_NAME}/" 2>/dev/null || true

          # Compress archive
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            echo "ASSET_FILE=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          else
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            echo "ASSET_FILE=${PKG_NAME}.zip" >> $GITHUB_ENV
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
