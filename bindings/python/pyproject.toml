[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "graphite-database"
version = "0.1.0"
description = "Official Python bindings for Graphite: embedded GraphRAG and knowledge graph engine"
readme = "README.md"
authors = [{ name = "João Cardoso", email = "joaocardosodias@users.noreply.github.com" }]
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
keywords = ["graphrag", "vector-database", "knowledge-graph", "llm", "embeddings", "ai-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.maturin]
python-source = "python"
module-name = "graphite_db._graphite_db"
features = ["pyo3/extension-module"]
