services:
  graphite:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/joaocardosodias/graphite:latest
    container_name: graphite-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - graphite-data:/data
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  graphite-data:
    driver: local
